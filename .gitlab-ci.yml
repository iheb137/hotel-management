stages:
  - validate
  - test
  - analyze
  - build

variables:
  COMPOSER_CACHE_DIR: .composer
  APP_ENV: test

composer_install:
  stage: validate
  image: composer:2
  cache:
    key: composer
    paths:
      - .composer/
  script:
    - composer install --prefer-dist --no-interaction --no-progress
  artifacts:
    paths:
      - vendor/
      - symfony.lock
      - .composer/

phpunit:
  stage: test
  image: php:8.2
  needs:
    - composer_install
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libicu-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo_mysql zip intl gd
    - pecl install xdebug
    - docker-php-ext-enable xdebug
    - php -v
  script:
    - mkdir -p var
    - php -dxdebug.mode=coverage bin/phpunit --configuration phpunit.xml.dist --colors=always --log-junit junit.xml --coverage-clover var/coverage.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - var/coverage.xml

phpstan:
  stage: analyze
  image: php:8.2
  needs:
    - composer_install
  before_script:
    - apt-get update && apt-get install -y git unzip
  script:
    - vendor/bin/phpstan analyse src --level=3 --no-progress

docker_build_push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - |
      if [ -z "$DOCKERHUB_USERNAME" ] || { [ -z "$DOCKERHUB_TOKEN" ] && [ -z "$DOCKERHUB_PASSWORD" ]; }; then
        echo "Skipping Docker build/push: missing Docker Hub credentials"
        exit 0
      fi
      if [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      else
        echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      fi
    - docker build -t $DOCKERHUB_USERNAME/ih-ar-app:$CI_COMMIT_SHORT_SHA -t $DOCKERHUB_USERNAME/ih-ar-app:latest .
    - docker push $DOCKERHUB_USERNAME/ih-ar-app --all-tags

sonarqube:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:5
  needs:
    - phpunit
  rules:
    - if: '$SONAR_TOKEN'
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.projectName=ih-ar-symfony -Dsonar.projectVersion=$CI_COMMIT_SHORT_SHA -Dsonar.branch.name=$CI_COMMIT_BRANCH -Dsonar.sources=src -Dsonar.tests=tests -Dsonar.sourceEncoding=UTF-8 -Dsonar.php.coverage.reportPaths=var/coverage.xml
