services:
  php:
    build: .
    container_name: true_project-php
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL:-mysql://hotux:hotux@db:3306/hotux?serverVersion=mariadb-10.4&charset=utf8mb4}
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    container_name: true_project-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:10.4
    container_name: true_project-db
    environment:
      MYSQL_DATABASE: hotux
      MYSQL_USER: hotux
      MYSQL_PASSWORD: hotux
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
